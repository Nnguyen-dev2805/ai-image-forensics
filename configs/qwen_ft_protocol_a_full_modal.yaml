project:
  name: ai-image-forensics
  phase: qwen_ft_protocol_a_full_modal
  description: Modal eval-full for Qwen2.5-VL LoRA fine-tuned on GenImage protocol A.

paths:
  data_root: /vol/data/protocol-a-small
  manifest_root: /vol/data/protocol-a-small/manifests
  cache_root: /vol/cache/aiforensics-qwen-ft-a-small
  output_root: /vol/eval/protocol-a-small/eval-full
  external_root: /vol/external

runtime:
  python: "3.10"
  seed: 70
  device: auto
  batch_size: 1
  num_workers: 2
  fail_fast: false

datasets:
  tiny_genimage:
    enabled: false
    source: TheKernel01/Tiny-GenImage
    use_original_split: true
    train_manifest: /vol/data/protocol-a-small/manifests/train.csv
    dev_manifest: /vol/data/protocol-a-small/manifests/eval_small.csv
    generators: []
    max_images: 0
    balance_labels: true
  genimage_unseen:
    enabled: true
    generators:
      - imagenet_ai_0419_biggan
      - imagenet_ai_0419_vqdm
      - imagenet_ai_0424_sdv5
      - imagenet_ai_0424_wukong
      - imagenet_ai_0508_adm
      - imagenet_glide
      - imagenet_midjourney
    max_images: 7000
    balance_labels: true
    split: external
    manifest: /vol/data/protocol-a-small/manifests/eval_full.csv
  synthbuster:
    enabled: false
    max_images: 0
    balance_labels: true
    split: external
    manifest: /vol/data/protocol-a-small/manifests/unused_synthbuster.csv

baselines:
  clip_probe:
    enabled: false
    model_family: openclip
    model_name: ViT-L-14-quickgelu
    pretrained: openai
    classifier: logistic_regression
    seeds: [70]
    cache_embeddings: true
  qwen_vl:
    enabled: false
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    prompt_id: qwen_json_v1
    temperature: 0.0
    max_new_tokens: 128
    cache_outputs: false
    allow_deferred: true
  assisted_qwen:
    enabled: false
    base_model_id: Qwen/Qwen2.5-VL-7B-Instruct
    prompt_id: assisted_qwen_json_v1
    assistant_source: clip_probe
    include_classifier_pred: true
    include_fake_probability: true
    temperature: 0.0
    max_new_tokens: 128
    cache_outputs: false
    allow_deferred: true
  npr:
    enabled: false
    repo_url: https://github.com/chuangchuangtan/NPR-DeepfakeDetection
    repo_commit: smoke-disabled
    checkpoint_path: /vol/external/npr/NPR.pth
    checkpoint_sha256: smoke-disabled
    batch_size: 2
    allow_deferred: true
  qwen_ft:
    enabled: true
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    adapter_uri: /vol/checkpoints/protocol-a-small/final_adapter
    prompt_id: qwen_ft_label_json_v1
    temperature: 0.0
    max_new_tokens: 32
    cache_outputs: false
    allow_deferred: false
    dtype: bfloat16
    min_pixels: 50176
    max_pixels: 200704
    output_fields:
      - label

evaluation:
  labels:
    negative: real
    positive: fake
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - auroc
  group_by:
    - source
    - split

report:
  filename: qwen_ft_protocol_a_full_modal_report.md
  include_failure_notes: true
  include_explanations_sample: false
  explanation_sample_size: 0
