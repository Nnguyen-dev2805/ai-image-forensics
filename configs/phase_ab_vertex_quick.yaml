project:
  name: ai-image-forensics
  phase: phase_ab_vertex_quick
  description: Quick Phase A/B slice for testing Qwen through Vertex AI.

paths:
  data_root: data
  manifest_root: manifests
  cache_root: .cache/aiforensics-vertex-quick
  output_root: outputs/vertex-quick
  external_root: external

runtime:
  python: "3.10"
  seed: 70
  device: auto
  batch_size: 8
  num_workers: 2
  fail_fast: false

datasets:
  tiny_genimage:
    enabled: true
    source: TheKernel01/Tiny-GenImage
    use_original_split: true
    train_manifest: manifests/tiny_genimage_train.csv
    dev_manifest: manifests/tiny_genimage_dev.csv
    generators:
      - imagenet_ai_0424_sdv5
    max_images: 40
    balance_labels: true
  genimage_unseen:
    enabled: true
    generators:
      - imagenet_midjourney
      - imagenet_ai_0508_adm
      - imagenet_ai_0419_biggan
      - imagenet_ai_0419_vqdm
      - imagenet_ai_0424_wukong
      - imagenet_glide
    max_images: 10
    balance_labels: true
    split: external
    manifest: manifests/genimage_unseen_external.csv
  synthbuster:
    enabled: false
    max_images: 20
    balance_labels: true
    split: external
    manifest: manifests/synthbuster_external.csv

baselines:
  clip_probe:
    enabled: true
    model_family: openclip
    model_name: ViT-L-14-quickgelu
    pretrained: openai
    classifier: logistic_regression
    seeds:
      - 70
    cache_embeddings: true
  qwen_vl:
    enabled: true
    model_id: Qwen/Qwen2.5-VL-7B-Instruct
    provider: vertex_openai
    prompt_id: qwen_json_v1
    dtype: float16
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
    allow_deferred: true
    vertex_project_id: "579187260419"
    vertex_location: asia-southeast1
    vertex_endpoint_id: mg-endpoint-ccc259a2-c268-4ca6-8713-3bcdaaaf5909
    vertex_endpoint_domain: mg-endpoint-ccc259a2-c268-4ca6-8713-3bcdaaaf5909.asia-southeast1-635507464424.prediction.vertexai.goog
    vertex_model_id: qwen2_5-vl-7b-instruct-1788570383931
    vertex_credentials_env_var: AIF_GOOGLE_APPLICATION_CREDENTIALS_JSON
  assisted_qwen:
    enabled: true
    base_model_id: Qwen/Qwen2.5-VL-7B-Instruct
    provider: vertex_openai
    prompt_id: assisted_qwen_json_v1
    assistant_source: clip_probe
    include_classifier_pred: true
    include_fake_probability: true
    dtype: float16
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
    allow_deferred: true
    vertex_project_id: "579187260419"
    vertex_location: asia-southeast1
    vertex_endpoint_id: mg-endpoint-ccc259a2-c268-4ca6-8713-3bcdaaaf5909
    vertex_endpoint_domain: mg-endpoint-ccc259a2-c268-4ca6-8713-3bcdaaaf5909.asia-southeast1-635507464424.prediction.vertexai.goog
    vertex_model_id: qwen2_5-vl-7b-instruct-1788570383931
    vertex_credentials_env_var: AIF_GOOGLE_APPLICATION_CREDENTIALS_JSON
  npr:
    enabled: true
    repo_url: https://github.com/chuangchuangtan/NPR-DeepfakeDetection
    repo_commit: 781ced3f7ca2cdc69ec9dd4ef27e8d0b3c07752a
    checkpoint_path: external/NPR-DeepfakeDetection/NPR.pth
    checkpoint_sha256: null
    batch_size: 8
    allow_deferred: true

evaluation:
  labels:
    negative: real
    positive: fake
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - auroc
  group_by:
    - source
    - split

report:
  filename: phase_ab_vertex_quick_report.md
  include_failure_notes: true
  include_explanations_sample: true
  explanation_sample_size: 6
