project:
  name: ai-image-forensics
  phase: phase_ab_smoke
  description: CPU smoke configuration for Phase A/B pipeline checks.

paths:
  data_root: tests/fixtures/smoke_data
  manifest_root: tests/fixtures/manifests
  cache_root: .cache/aiforensics-smoke
  output_root: outputs/smoke
  external_root: external

runtime:
  python: "3.10"
  seed: 70
  device: cpu
  batch_size: 2
  num_workers: 0
  fail_fast: false

datasets:
  tiny_genimage:
    enabled: true
    source: smoke-fixtures
    use_original_split: false
    train_manifest: tests/fixtures/manifests/smoke_train.csv
    dev_manifest: tests/fixtures/manifests/smoke_dev.csv
    generators: []
    max_images: 0
    balance_labels: true
  genimage_unseen:
    enabled: false
    generators: []
    max_images: 8
    balance_labels: true
    split: external
    manifest: tests/fixtures/manifests/smoke_external.csv
  synthbuster:
    enabled: false
    max_images: 8
    balance_labels: true
    split: external
    manifest: tests/fixtures/manifests/smoke_synthbuster.csv

baselines:
  clip_probe:
    enabled: true
    model_family: synthetic
    model_name: smoke-embedding
    pretrained: none
    classifier: logistic_regression
    seeds:
      - 70
    cache_embeddings: false
  qwen_vl:
    enabled: false
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: qwen_json_v1
    temperature: 0.0
    max_new_tokens: 128
    cache_outputs: false
    allow_deferred: true
  assisted_qwen:
    enabled: false
    base_model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: assisted_qwen_json_v1
    assistant_source: clip_probe
    include_classifier_pred: true
    include_fake_probability: true
    temperature: 0.0
    max_new_tokens: 128
    cache_outputs: false
    allow_deferred: true
  npr:
    enabled: false
    repo_url: https://github.com/chuangchuangtan/NPR-DeepfakeDetection
    repo_commit: smoke-disabled
    checkpoint_path: external/NPR-DeepfakeDetection/NPR.pth
    checkpoint_sha256: smoke-disabled
    batch_size: 2
    allow_deferred: true

evaluation:
  labels:
    negative: real
    positive: fake
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - auroc
  group_by:
    - source
    - split

report:
  filename: phase_ab_smoke_report.md
  include_failure_notes: true
  include_explanations_sample: false
  explanation_sample_size: 0

