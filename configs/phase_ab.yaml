project:
  name: ai-image-forensics
  phase: phase_ab
  description: Reproducible baseline suite for AI-generated image detection.

paths:
  data_root: data
  manifest_root: manifests
  cache_root: .cache/aiforensics
  output_root: outputs
  external_root: external

runtime:
  python: "3.10"
  seed: 70
  device: auto
  batch_size: 32
  num_workers: 2
  fail_fast: false

datasets:
  # GenImage-layout root: <data_root>/<generator>/<split>/{ai,nature}/*.{png,jpg,jpeg,...}
  # `ai` maps to label fake, `nature` to real; `train`/`val` map to splits
  # train/dev. Manifests are built by `aiforensics prepare --build-manifests`.
  tiny_genimage:
    enabled: true
    source: TheKernel01/Tiny-GenImage
    use_original_split: true
    train_manifest: manifests/tiny_genimage_train.csv
    dev_manifest: manifests/tiny_genimage_dev.csv
    # In-distribution generator. One generator keeps every other generator
    # strictly held out, so cross-generator numbers stay honest.
    generators:
      - imagenet_ai_0424_sdv5
    # Per-generator cap per split; 0 means no cap. First-run budget: enough to
    # train a probe and read per-source metrics without spending the whole
    # session on Qwen-VL generation. Raise once the pipeline is proven.
    max_images: 400
    balance_labels: true
  genimage_unseen:
    enabled: true
    # Held-out generators: never trained on, used for cross-generator evaluation.
    generators:
      - imagenet_midjourney
      - imagenet_ai_0508_adm
      - imagenet_ai_0419_biggan
      - imagenet_ai_0419_vqdm
      - imagenet_ai_0424_wukong
      - imagenet_glide
    # Per-generator cap: 100 each across 6 generators, so per-source metrics
    # stay comparable instead of one generator dominating a pooled cap.
    max_images: 100
    balance_labels: true
    split: external
    manifest: manifests/genimage_unseen_external.csv
  synthbuster:
    enabled: false
    max_images: 1000
    balance_labels: true
    split: external
    manifest: manifests/synthbuster_external.csv

baselines:
  clip_probe:
    enabled: true
    model_family: openclip
    model_name: ViT-L-14
    pretrained: openai
    classifier: logistic_regression
    seeds:
      - 70
      - 71
      - 72
    cache_embeddings: true
  qwen_vl:
    enabled: true
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: qwen_json_v1
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
  assisted_qwen:
    enabled: true
    base_model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: assisted_qwen_json_v1
    assistant_source: clip_probe
    include_classifier_pred: true
    include_fake_probability: true
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
  npr:
    enabled: true
    repo_url: https://github.com/chuangchuangtan/NPR-DeepfakeDetection
    # Latest official commit as of 2026-09-02, verified via the GitHub API:
    # "Update train.py" (2025-05-01, signed).
    repo_commit: 781ced3f7ca2cdc69ec9dd4ef27e8d0b3c07752a
    checkpoint_path: external/NPR-DeepfakeDetection/NPR.pth
    checkpoint_sha256: null
    batch_size: 32
    allow_deferred: true

evaluation:
  labels:
    negative: real
    positive: fake
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - auroc
  group_by:
    - source
    - split

report:
  filename: phase_ab_report.md
  include_failure_notes: true
  include_explanations_sample: true
  explanation_sample_size: 20
