project:
  name: ai-image-forensics
  phase: phase_ab
  description: Reproducible baseline suite for AI-generated image detection.

paths:
  data_root: data
  manifest_root: manifests
  cache_root: .cache/aiforensics
  output_root: outputs
  external_root: external

runtime:
  python: "3.10"
  seed: 70
  device: auto
  batch_size: 32
  num_workers: 2
  fail_fast: false

datasets:
  tiny_genimage:
    enabled: true
    source: TheKernel01/Tiny-GenImage
    use_original_split: true
    train_manifest: manifests/tiny_genimage_train.csv
    dev_manifest: manifests/tiny_genimage_dev.csv
  genimage_unseen:
    enabled: true
    preferred_generator: midjourney
    fallback_generators:
      - adm
      - biggan
    max_images: 1000
    balance_labels: true
    split: external
    manifest: manifests/genimage_midjourney_external.csv
  synthbuster:
    enabled: true
    max_images: 1000
    balance_labels: true
    split: external
    manifest: manifests/synthbuster_external.csv

baselines:
  clip_probe:
    enabled: true
    model_family: openclip
    model_name: ViT-L-14
    pretrained: openai
    classifier: logistic_regression
    seeds:
      - 70
      - 71
      - 72
    cache_embeddings: true
  qwen_vl:
    enabled: true
    model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: qwen_json_v1
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
  assisted_qwen:
    enabled: true
    base_model_id: Qwen/Qwen2.5-VL-3B-Instruct
    prompt_id: assisted_qwen_json_v1
    assistant_source: clip_probe
    include_classifier_pred: true
    include_fake_probability: true
    temperature: 0.0
    max_new_tokens: 256
    cache_outputs: true
  npr:
    enabled: true
    repo_url: https://github.com/chuangchuangtan/NPR-DeepfakeDetection
    # Latest official commit as of 2026-09-02, verified via the GitHub API:
    # "Update train.py" (2025-05-01, signed).
    repo_commit: 781ced3f7ca2cdc69ec9dd4ef27e8d0b3c07752a
    checkpoint_path: external/NPR-DeepfakeDetection/NPR.pth
    checkpoint_sha256: null
    batch_size: 32
    allow_deferred: true

evaluation:
  labels:
    negative: real
    positive: fake
  metrics:
    - accuracy
    - balanced_accuracy
    - precision
    - recall
    - f1
    - auroc
  group_by:
    - source
    - split

report:
  filename: phase_ab_report.md
  include_failure_notes: true
  include_explanations_sample: true
  explanation_sample_size: 20
