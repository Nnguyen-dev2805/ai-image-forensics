[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiforensics"
version = "0.1.0"
requires-python = ">=3.10,<3.11"
dependencies = []

[project.scripts]
aiforensics = "aiforensics.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
