<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace; }
      .title { fill: #f8fafc; font-size: 17px; font-weight: 700; }
      .subtitle { fill: #94a3b8; font-size: 10px; }
      .box-title { fill: #f8fafc; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .box-sub { fill: #cbd5e1; font-size: 9px; text-anchor: middle; }
      .tiny { fill: #94a3b8; font-size: 8px; text-anchor: middle; }
      .label { fill: #cbd5e1; font-size: 8px; text-anchor: middle; }
      .region { fill: none; stroke: #fbbf24; stroke-width: 1.2; stroke-dasharray: 10,5; }
      .region-title { fill: #fbbf24; font-size: 10px; font-weight: 700; }
      .note { fill: #f8fafc; font-size: 10px; font-weight: 600; }
      .note-sub { fill: #cbd5e1; font-size: 8.5px; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <text x="40" y="40" class="title">Qwen2.5-VL LoRA fine-tuning pipeline</text>
  <text x="40" y="60" class="subtitle">ai-image-forensics / Modal / GenImage Protocol A small</text>

  <rect x="30" y="90" width="235" height="490" rx="12" class="region"/>
  <text x="45" y="112" class="region-title">Local + Kaggle handoff</text>

  <rect x="320" y="90" width="545" height="490" rx="12" class="region"/>
  <text x="335" y="112" class="region-title">Modal Volume and A100 training</text>

  <rect x="920" y="90" width="220" height="490" rx="12" class="region"/>
  <text x="935" y="112" class="region-title">AIF CLI evaluation</text>

  <path d="M 235 180 L 340 180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="287" y="168" class="label">upload zip</text>
  <path d="M 520 180 L 620 180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="570" y="168" class="label">sample + manifest</text>
  <path d="M 795 180 L 970 180" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="882" y="168" class="label">final_adapter</text>
  <path d="M 1030 245 L 1030 325" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>
  <path d="M 1030 390 L 1030 470" fill="none" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrow-emerald)"/>

  <rect x="65" y="140" width="170" height="80" rx="6" fill="#0f172a"/>
  <rect x="65" y="140" width="170" height="80" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="150" y="168" class="box-title">Raw GenImage zip</text>
  <text x="150" y="186" class="box-sub">7 generators</text>
  <text x="150" y="202" class="box-sub">train / val, ai / nature</text>

  <rect x="340" y="140" width="180" height="80" rx="6" fill="#0f172a"/>
  <rect x="340" y="140" width="180" height="80" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="168" class="box-title">Modal Volume</text>
  <text x="430" y="186" class="box-sub">/archives/raw.zip</text>
  <text x="430" y="202" class="box-sub">persistent storage</text>

  <rect x="620" y="135" width="175" height="90" rx="6" fill="#0f172a"/>
  <rect x="620" y="135" width="175" height="90" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="707.5" y="162" class="box-title">prepare_from_raw</text>
  <text x="707.5" y="181" class="box-sub">1400 train images</text>
  <text x="707.5" y="197" class="box-sub">700 eval-small images</text>
  <text x="707.5" y="213" class="box-sub">seed 70, balanced</text>

  <path d="M 707.5 225 L 707.5 300" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="750" y="265" class="label">JSONL split</text>

  <rect x="620" y="300" width="175" height="95" rx="6" fill="#0f172a"/>
  <rect x="620" y="300" width="175" height="95" rx="6" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="707.5" y="327" class="box-title">train_lora</text>
  <text x="707.5" y="346" class="box-sub">Qwen2.5-VL-7B</text>
  <text x="707.5" y="362" class="box-sub">LoRA, bf16, grad ckpt</text>
  <text x="707.5" y="378" class="box-sub">224-448 pixel bounds</text>

  <path d="M 620 348 L 520 348" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="570" y="336" class="label">writes</text>

  <rect x="340" y="303" width="180" height="90" rx="6" fill="#0f172a"/>
  <rect x="340" y="303" width="180" height="90" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="430" y="330" class="box-title">Artifacts</text>
  <text x="430" y="349" class="box-sub">/data/protocol-a-small</text>
  <text x="430" y="365" class="box-sub">/checkpoints/final_adapter</text>
  <text x="430" y="381" class="box-sub">training_meta.json</text>

  <rect x="970" y="140" width="120" height="105" rx="6" fill="#0f172a"/>
  <rect x="970" y="140" width="120" height="105" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="1030" y="167" class="box-title">qwen_ft run</text>
  <text x="1030" y="186" class="box-sub">load base model</text>
  <text x="1030" y="202" class="box-sub">load LoRA adapter</text>
  <text x="1030" y="218" class="box-sub">emit predictions</text>

  <rect x="950" y="325" width="160" height="65" rx="6" fill="#0f172a"/>
  <rect x="950" y="325" width="160" height="65" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1030" y="352" class="box-title">evaluate</text>
  <text x="1030" y="371" class="box-sub">metrics + groups</text>

  <rect x="950" y="470" width="160" height="75" rx="6" fill="#0f172a"/>
  <rect x="950" y="470" width="160" height="75" rx="6" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
  <text x="1030" y="498" class="box-title">report</text>
  <text x="1030" y="517" class="box-sub">Markdown summary</text>
  <text x="1030" y="533" class="box-sub">download results</text>

  <rect x="65" y="300" width="180" height="95" rx="6" fill="#0f172a"/>
  <rect x="65" y="300" width="180" height="95" rx="6" fill="rgba(30,41,59,0.55)" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="327" class="box-title">Label mapping</text>
  <text x="155" y="347" class="box-sub">GenImage ai -> fake</text>
  <text x="155" y="363" class="box-sub">GenImage nature -> real</text>
  <text x="155" y="379" class="box-sub">target: JSON label only</text>

  <rect x="335" y="470" width="535" height="70" rx="6" fill="#0f172a"/>
  <rect x="335" y="470" width="535" height="70" rx="6" fill="rgba(136,19,55,0.35)" stroke="#fb7185" stroke-width="1.5"/>
  <text x="355" y="497" class="note">Current risk handled:</text>
  <text x="515" y="497" class="note-sub">previous run reached 25/88 steps, then OOM on A100-40GB.</text>
  <text x="355" y="517" class="note-sub">Mitigation in code: batch size 1, gradient accumulation 16, bf16, gradient checkpointing,</text>
  <text x="355" y="532" class="note-sub">PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True, max_pixels=200704, min_pixels=50176.</text>

  <rect x="40" y="620" width="1100" height="60" rx="8" fill="#0f172a"/>
  <rect x="40" y="620" width="1100" height="60" rx="8" fill="rgba(59,130,246,0.18)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="60" y="646" fill="#f8fafc" font-size="10" font-weight="700">Outputs to inspect:</text>
  <text x="190" y="646" fill="#cbd5e1" font-size="9">predictions.jsonl</text>
  <text x="340" y="646" fill="#cbd5e1" font-size="9">metrics.json</text>
  <text x="465" y="646" fill="#cbd5e1" font-size="9">metrics_by_source.csv</text>
  <text x="655" y="646" fill="#cbd5e1" font-size="9">logs.txt</text>
  <text x="760" y="646" fill="#cbd5e1" font-size="9">status.json</text>
  <text x="890" y="646" fill="#cbd5e1" font-size="9">qwen_ft_protocol_a_*_modal_report.md</text>
</svg>
